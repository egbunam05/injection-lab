[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-lab"
version = "0.1.0"
description = "Measure prompt-injection attacks and layered defenses on a small LLM app. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ibegbunam Emmanuel" }]
keywords = ["llm", "prompt-injection", "red-teaming", "evaluation", "security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
injection-lab = "injection_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
injection_lab = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
